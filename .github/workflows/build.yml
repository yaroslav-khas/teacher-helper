name: Build Windows app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # Пуш тегу v* -> справжній реліз: збірка публікується в GitHub Releases,
      # звідти ж її потім знайде вбудований авто-апдейтер.
      - name: Build and publish release
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run dist:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Запуск вручну (без тегу) -> просто зібрати й покласти .exe в артефакти
      # цього прогону, для швидкої перевірки без створення релізу.
      - name: Build only
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run dist

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: windows-build
          path: release/*.exe
