<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<title>Логи</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #14161a;
    color: #f2f2f2;
    font-family: "Segoe UI", system-ui, sans-serif;
  }

  body {
    display: flex;
    flex-direction: column;
  }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: #1d2026;
    border-bottom: 1px solid #2c303a;
    flex-shrink: 0;
  }

  .toolbar button {
    font-size: 13px;
    background: #262a33;
    border: 1px solid #3a4050;
    border-radius: 6px;
    color: inherit;
    padding: 6px 12px;
    cursor: pointer;
  }

  .toolbar button:hover {
    background: #323744;
  }

  .path-label {
    margin-left: auto;
    font-size: 12px;
    opacity: 0.6;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .copy-flash {
    color: #34c759;
    opacity: 0;
    transition: opacity 0.2s;
    font-size: 12px;
  }

  .copy-flash.show {
    opacity: 1;
  }

  pre {
    flex: 1;
    margin: 0;
    padding: 12px 16px;
    overflow: auto;
    font-family: "SF Mono", Consolas, "Courier New", monospace;
    font-size: 12px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }
</style>
</head>
<body>
  <div class="toolbar">
    <button id="refresh">🔄 Оновити</button>
    <button id="copy">📋 Скопіювати все</button>
    <span id="copy-flash" class="copy-flash">Скопійовано!</span>
    <span id="path-label" class="path-label"></span>
  </div>
  <pre id="log-content">Завантаження…</pre>

  <script src="logs.js"></script>
</body>
</html>
