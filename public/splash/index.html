<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<title>Завантаження…</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #1d2026;
    color: #f2f2f2;
    font-family: "Segoe UI", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-user-select: none;
    user-select: none;
  }

  .splash {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .splash img {
    width: 72px;
    height: 72px;
  }

  .spinner {
    width: 28px;
    height: 28px;
    border: 3px solid #333844;
    border-top-color: #4c8dff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  .label {
    font-size: 14px;
    opacity: 0.8;
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }
</style>
</head>
<body>
  <div class="splash">
    <img src="icon.png" alt="" />
    <div class="spinner"></div>
    <div class="label">Завантаження…</div>
  </div>
</body>
</html>
